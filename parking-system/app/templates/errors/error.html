{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="glass" style="max-width: 520px; text-align:center;">
    <div style="font-size: 60px; font-weight: 700; color: var(--primary); letter-spacing:-0.04em;">{{ code }}</div>
    <h1 style="font-size: 24px; margin-top: var(--s-3);">{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('main.index') }}">Back to home</a>
  </div>
</div>
{% endblock %}

{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}
