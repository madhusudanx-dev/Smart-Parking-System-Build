{% from "macros.html" import icon %}
{% macro floorplan(levels, interactive=true, show_filters=true, live=true, default_level=None) %}
<div class="floorplan-wrap">
  {% if show_filters %}
  <div class="chip-row" role="tablist" aria-label="Slot type filter">
    <button class="chip active" data-filter="all"      role="tab" aria-selected="true">{{ icon('list', 15) }} All slots</button>
    <button class="chip"        data-filter="standard" role="tab" aria-selected="false">{{ icon('square-parking', 15) }} Standard</button>
    <button class="chip"        data-filter="ev"       role="tab" aria-selected="false">{{ icon('zap', 15) }} EV Charging</button>
    <button class="chip"        data-filter="women"    role="tab" aria-selected="false">{{ icon('shield-check', 15) }} Women&rsquo;s Safety</button>
  </div>
  {% endif %}

  <div class="chip-row" role="tablist" aria-label="Floor level">
    {% for lvl in levels %}
      <button class="chip {{ 'active' if (default_level is none and loop.first) or default_level == lvl.id else '' }}"
              data-level="{{ lvl.id }}" role="tab"
              aria-selected="{{ 'true' if (default_level is none and loop.first) or default_level == lvl.id else 'false' }}">
        {{ icon('map-pin', 15) }} {{ lvl.name }}
      </button>
    {% endfor %}
  </div>

  <div class="glass floorplan"
       data-live="{{ '1' if live else '0' }}"
       data-interactive="{{ '1' if interactive else '0' }}"
       data-level="{{ default_level or (levels[0].id if levels else 1) }}">
    <svg viewBox="0 0 1000 620" role="img"
         aria-label="Parking floor plan. Use Tab to move between slots and press Enter to select a slot."
         class="floorplan-svg">

      <!-- Slot-tile layer (populated by JS) -->
      <g data-slot-layer></g>

      <!-- Static background: grid, zone, cabin, arrows -->
      <defs>
        <pattern id="hgrid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none"
                stroke="rgba(45,54,64,0.05)" stroke-width="1"/>
        </pattern>
      </defs>

      <!-- Women's Safety zone glow -->
      <rect x="160" y="100" width="370" height="110" rx="18"
            fill="rgba(235,207,247,0.36)" stroke="rgba(107,42,138,0.25)"
            stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="175" y="92" font-family="Inter, sans-serif" font-size="12"
            font-weight="600" fill="#6B2A8A" letter-spacing="0.05em">
        WOMEN&rsquo;S SAFETY ZONE &middot; CCTV COVERED
      </text>

      <!-- Security cabin -->
      <rect x="20" y="20" width="130" height="60" rx="12"
            fill="rgba(255,255,255,0.72)" stroke="rgba(45,54,64,0.14)"/>
      <text x="85" y="46" text-anchor="middle" font-family="Inter, sans-serif"
            font-size="12" font-weight="700" fill="#2D3640">SECURITY</text>
      <text x="85" y="62" text-anchor="middle" font-family="Inter, sans-serif"
            font-size="11" fill="#6B7280">Cabin &middot; CCTV</text>

      <!-- Entrance -->
      <g transform="translate(20,540)">
        <rect width="150" height="48" rx="14"
              fill="rgba(205,239,224,0.78)" stroke="rgba(30,107,78,0.32)"/>
        <text x="75" y="21" text-anchor="middle" font-family="Inter, sans-serif"
              font-size="11" font-weight="700" fill="#1E6B4E">ENTRANCE</text>
        <text x="75" y="38" text-anchor="middle" font-family="Inter, sans-serif"
              font-size="11" fill="#1E6B4E">Keep left &rarr;</text>
      </g>

      <!-- Exit -->
      <g transform="translate(830,540)">
        <rect width="150" height="48" rx="14"
              fill="rgba(249,203,214,0.78)" stroke="rgba(138,46,74,0.32)"/>
        <text x="75" y="21" text-anchor="middle" font-family="Inter, sans-serif"
              font-size="11" font-weight="700" fill="#8A2E4A">EXIT</text>
        <text x="75" y="38" text-anchor="middle" font-family="Inter, sans-serif"
              font-size="11" fill="#8A2E4A">&larr; Follow signs</text>
      </g>

      <!-- Lane markers -->
      <line x1="120" y1="290" x2="880" y2="290"
            stroke="rgba(255,255,255,0.92)" stroke-width="3"
            stroke-dasharray="14 12"/>
      <line x1="120" y1="410" x2="880" y2="410"
            stroke="rgba(255,255,255,0.92)" stroke-width="3"
            stroke-dasharray="14 12"/>
    </svg>

    <div class="floorplan-legend">
      <span><i class="dot available"></i> Available</span>
      <span><i class="dot occupied"></i> Occupied</span>
      <span><i class="dot reserved"></i> Reserved</span>
      <span><i class="dot ev"></i> EV Charging</span>
      <span><i class="dot women"></i> Women&rsquo;s Safety</span>
    </div>
  </div>
</div>
{% endmacro %}
